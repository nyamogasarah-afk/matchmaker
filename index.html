<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>💜 Match Maker 🤍</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="hearts-bg">
    <span>💜</span><span>🤍</span><span>💘</span><span>💕</span><span>💜</span>
    <span>🥰</span><span>💜</span><span>😍</span><span>💜</span><span>🤍</span>
    <span>💖</span><span>💜</span><span>✨</span><span>💜</span><span>💝</span>
  </div>

  <div class="heart-card">
    <div class="content">
      <h1>💜 Match Maker 🤍</h1>
      <p class="tag">✨ Purple • White • True Love ✨</p>
      
      <div class="inputs">
        <div class="input-wrap">
          <span class="emoji-icon">👩‍❤️‍👨</span>
          <input type="text" id="name1" placeholder="💃 Your Name">
        </div>
        <span class="plus">💜</span>
        <div class="input-wrap">
          <span class="emoji-icon">💘</span>
          <input type="text" id="name2" placeholder="🕺 Crush Name">
        </div>
      </div>

      <button id="matchBtn">💜✨ Check Match ✨🤍</button>
      <div class="error" id="error"></div>

      <div id="result">
        <div class="result-heart">
          <div class="emoji-burst">💖💘💜🤍💝</div>
          <h2 id="score">0% 💜</h2>
          <p id="message"></p>
          <div class="emoji-burst">✨🥰😍✨</div>
        </div>
      </div>

      <p class="footer">💯 Free • 🔒 Private • No Signup 💜</p>
    </div>
  </div>
<script src="script.js"></script>
</body>
</html>
